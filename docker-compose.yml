version: '3.8'

services:
  jira-time-machine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira-time-machine-app
    ports:
      - "8050:8050"
    env_file:
      - .env
    environment:
      # Application settings
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8050}
      - DEBUG=${DEBUG:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
